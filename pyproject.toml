[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-vault"
version = "0.2.2"
description = "Portable encrypted credential vault with reusable OAuth/OIDC and Globus token lifecycles"
readme = "README.md"
requires-python = ">=3.14"
classifiers = ["Programming Language :: Python :: 3.14"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "authlib>=1.8,<2",
  "joserfc>=1.7.5,<2",
  "requests>=2.34.2,<3",
  "globus-sdk>=4.9,<5",
  "keyring>=25",
  "keyrings.cryptfile==1.5.0",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "packaging>=23",
  "pytest>=8",
]

[project.entry-points."beauty.post"]
credential-vault = "credential_vault.tools.post:main"

[project.urls]
Repository = "https://github.com/rpwagner/credential-vault"
Issues = "https://github.com/rpwagner/credential-vault/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
