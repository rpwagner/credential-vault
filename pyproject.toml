[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-vault"
version = "0.1.0"
description = "Portable encrypted credential vault with reusable Globus token lifecycle"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "globus-sdk>=4.9,<5",
  "keyring>=25",
  "keyrings.cryptfile @ https://github.com/rpwagner/keyrings.cryptfile/releases/download/v1.5.0/keyrings_cryptfile-1.5.0-py3-none-any.whl",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8",
]

[project.urls]
Repository = "https://github.com/rpwagner/credential-vault"
Issues = "https://github.com/rpwagner/credential-vault/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
