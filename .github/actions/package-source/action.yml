name: Prepare verified package sources
description: Mirror the reviewed fork and let pip stage the public dependency closure
inputs:
  github-token:
    required: true
    description: Read-only GitHub token for public fork release mirroring
runs:
  using: composite
  steps:
    - name: Mirror and verify the reviewed cryptfile release
      shell: bash
      env:
        GHR_PYPI_TOKEN: ${{ inputs.github-token }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install ghr-pypi==2026.8.14.1
        source_dir="${RUNNER_TEMP}/vault-package-source"
        ghr-pypi index rpwagner/keyrings.cryptfile --mirror --out "$source_dir/mirror"
        fork_wheel="$(python tools/check_cryptfile_source.py --mirror "$source_dir/mirror")"
        # Explicit local input protects fork selection during public dependency staging.
        python -m pip download --only-binary=:all: --dest "$source_dir/dependencies" \
          ".[test]" "$fork_wheel" 'setuptools>=77' wheel
        rm "$source_dir/dependencies/$(basename "$fork_wheel")"
        # During installation only the mirror can supply cryptfile. Public wheels
        # are pip's resolved closure, not a second maintained dependency graph.
        echo "VAULT_PACKAGE_SOURCE=$source_dir" >> "$GITHUB_ENV"
        echo "PIP_CONFIG_FILE=/dev/null" >> "$GITHUB_ENV"
        echo "PIP_INDEX_URL=$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).as_uri()+"/")' "$source_dir/mirror/simple")" >> "$GITHUB_ENV"
        echo "PIP_EXTRA_INDEX_URL=" >> "$GITHUB_ENV"
        echo "PIP_FIND_LINKS=$source_dir/dependencies" >> "$GITHUB_ENV"
        echo "PIP_ONLY_BINARY=keyrings.cryptfile" >> "$GITHUB_ENV"
        echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
