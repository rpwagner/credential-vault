name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - "*"
  schedule:
    # Weekly on Sunday at 05:47 UTC.
    - cron: '47 5 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main') && github.sha || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python -m pip check
      - name: Run test suite
        run: python -m pytest -ra

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Read package version
        run: |
          python -m pip install --editable .
          echo "PACKAGE_VERSION=$(python -c 'from importlib.metadata import version; print(version("credential-vault"))')" >> "${GITHUB_ENV}"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os; expected = 'v' + os.environ['PACKAGE_VERSION']; actual = os.environ['GITHUB_REF_NAME']; assert actual == expected, f'Release tag {actual!r} does not match package version {expected!r}'"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -I -c "from importlib.metadata import version; import credential_vault; assert version('credential-vault')"
      - name: Install and smoke-test source distribution
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-smoke"
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -I -c "from importlib.metadata import version; import credential_vault; assert version('credential-vault')"
      - name: Prepare release distributions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload release distributions
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Approve and publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
