name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  schedule:
    # Weekly on Sunday at 05:47 UTC.
    - cron: '47 5 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main') && github.sha || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare verified package sources
        uses: ./.github/actions/package-source
        with:
          github-token: ${{ github.token }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]" --report "${RUNNER_TEMP}/editable-install.json"
          python tools/check_cryptfile_source.py --mirror "$VAULT_PACKAGE_SOURCE/mirror" --report "${RUNNER_TEMP}/editable-install.json"
          python -m pip check
      - name: Run test suite
        run: python -m pytest -ra

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare verified package sources
        uses: ./.github/actions/package-source
        with:
          github-token: ${{ github.token }}
      - name: Read package version
        run: |
          python -m pip install --editable .
          echo "PACKAGE_VERSION=$(python -c 'from importlib.metadata import version; print(version("credential-vault"))')" >> "${GITHUB_ENV}"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          # Packaging-only tooling uses PyPI before the isolated install exercise.
          PIP_INDEX_URL=https://pypi.org/simple python -m pip install twine
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          python tools/check_index_install.py \
            --python "${RUNNER_TEMP}/wheel-smoke/bin/python" --artifact dist/*.whl \
            --mirror "$VAULT_PACKAGE_SOURCE/mirror" --dependencies "$VAULT_PACKAGE_SOURCE/dependencies"
      - name: Install and smoke-test source distribution
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-smoke"
          python tools/check_index_install.py \
            --python "${RUNNER_TEMP}/sdist-smoke/bin/python" --artifact dist/*.tar.gz \
            --mirror "$VAULT_PACKAGE_SOURCE/mirror" --dependencies "$VAULT_PACKAGE_SOURCE/dependencies"

